[package]
name = "character-studio-core"
version = "1.0.0"
description = "Local AI Runtime Platform"
authors = ["Character Studio Team"]
edition = "2021"

[dependencies]
tauri = { version = "1.5.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.29" # For CPU/RAM hardware detection
nvml-wrapper = "0.9.0" # For NVIDIA GPU detection
rusqlite = { version = "0.29", features = ["bundled"] } # SQLite database
tokio = { version = "1.34", features = ["full"] } # Async runtime for subprocesses
reqwest = { version = "0.11", features = ["stream", "json"] }
eventsource-stream = "0.2"
futures-util = "0.3"
uuid = { version = "1.0", features = ["v4"] }
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
ureq = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "1.5.0", features = [] }

[dev-dependencies]
tempfile = "3.27.0"
